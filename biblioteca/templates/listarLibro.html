{% extends 'base.html' %}
{% block content %}
<div class="container cols-8 -2 mt-5">
    <div class="justify-content-center text-center">
        <h3>listar de libros</h3>
            <div class="mt-3">
                <table class="table table-dark table-striped">
                    <thead>
                    <tr>
                        <th>Titulo</th>
                        <th>Descripcion</th>
                        <th>Autor</th>
                       <th>Acciones</> 
                    </tr>
                </thead>
                    <tbody>
                    {% for libro in libros %}
                    <tr>
                        <td>{{libro.titulo}}</td>
                        <td>{{libro.descripcion}}</td>
                        <td>{{libro.autor_id}}</td>
                        <td>
                            
                    <a herf="{% url 'editarLibros' libro.pk %}" class="btn btn-warning">Actualizar</a>
                    <a herf="{% url 'eliminarLibros' libro.pk %}" class="btn btn-danger">Eliminar</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% endblock %}

{% extends 'base.html' %}

{% block content %}

<div class="container">
    <h1>Crear Libro</h1>
    <form method="POST" action="{% url 'crearLibros' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label for="titulo" class="form-label">Titulo</label>
            <input
                type="text"
                class="form-control"
                id="titulo"
                name="titulo"
                required>
        </div>
        <div class="mb-3">
            <label for="descripcion" class="form-label">Descripcion</label>
            <textarea
                class="form-control" 
                id="descripcion" 
                name="descripcion" 
                required>
            </textarea>
        </div>
        <div class="mb-3">
            <label for="autor">Autores</label>
            <select class="form-select" name="autor" id="autor" required>
                <option value="" disabled selected>Seleccione un autor</option>
                {% for autor in autores %}
                <option value="{{ autor.id }}">{{ autor.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <input type="submit" class="btn btn-success" value="Guardar">
        </div>
{% endblock %}

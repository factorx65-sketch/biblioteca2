{% extends 'base.html' %}
{% block content %}
   
<div class="container">
 <form action="{% url 'editarLibros' libro.pk %}" method="POST">

    {% csrf_token %}
    <div class="mb"3>
        <label for="titulo" class="form-label">Titulo</label>
        <input id="titulo"
        tipe="text"
        name="titulo"
        class="form-control"
        value="{{libro.titulo}}"/>
    </div>

<div class="mb-3">
    <label for="descripcion"class="form-label">descripcion</label>
    <textarea id="descripcion" 
    name="descripcion" 
    class="form-control"
    >{{libro.descripcion}}</textarea>
</div> 
</div  class="mb-3">
            <label for="autor">Autores</label>
            <select class="form-control" name="autor" id="autor" required>
                {% for autor in autores %}
                <option value="{{ autor.id }}" {% if autor.id == libro.autor_id.pk %} selected {% endif %}>{{ autor.nombre }}</option>
                {% endfor %}
        </select>
    
    </div>
    <input type="submit"class="btn btn-warning" value="actualizar"/>

</form>

        <div class="container mb-2">
        <form action='{% url "eliminarLibros" libro.pk %}' method='POST'>
            {% csrf_token %}
            <input type="submit" class="btn btn-danger" value="Eliminar"/>
        </form>
        {% endblock  %}
